[variables]
NODE_VERSION = "20"

[phases.setup]
nixPkgs = [
  "(php.withExtensions (pe: pe.enabled ++ []))",
  "nginx",
  "libmysqlclient",
  "phpPackages.composer",
  "nodejs_20",
  "nodePackages.npm"
]

[phases.install]
cmds = [
  "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
  "composer install --ignore-platform-reqs --optimize-autoloader --no-interaction",
  "npm ci --legacy-peer-deps"
]

[phases.build]
cmds = [
  "npm run build",
  "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache && chmod -R a+rw storage"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force --class=UserSeeder && php artisan db:seed --force --class=CandidateSeeder || true && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
